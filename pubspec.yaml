name: memory_stack
description: "Spaced repetition for DSA problems."
publish_to: 'none'
version: 1.36.0+41

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.1.0
  file_picker: ^13.3.2
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  flutter_local_notifications: ^22.3.3
  flutter_widget_from_html_core: ^0.17.4
  google_sign_in: ^7.2.0
  highlight: ^0.7.0
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/sheets/
    - assets/illustrations/

# App icon: `dart run flutter_launcher_icons` regenerates the Android and web icons from these files.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#6C4EF5"
  adaptive_icon_foreground: assets/icon/foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#6C4EF5"
    theme_color: "#6C4EF5"
