include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - ios/**
    - firestore-tests/**
  language:
    # No silent dynamic casts, no implicit dynamic in inference or generics.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # A Future that is not awaited must be marked with unawaited(), so dropping one is always deliberate.
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_type_to_string
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_build_context_synchronously
    - only_throw_errors
    - throw_in_finally
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - directives_ordering
    - sort_child_properties_last
